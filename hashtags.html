<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>هاشتاجات الملاحظات — مصحف التدبر</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#F4EFE4;color:#2B2620;font-family:Tajawal,Tahoma,sans-serif}header,main{max-width:960px;margin:auto;padding:20px}nav{display:flex;justify-content:space-between;gap:12px}a{color:#7C6329}h1{font-size:26px;margin-bottom:8px}p{line-height:1.8}input{width:100%;padding:12px;border:1px solid #D9CFB8;border-radius:10px;background:#FBF8F1;font:inherit}#tags{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{font:inherit;cursor:pointer;border:1px solid #D9CFB8;border-radius:20px;padding:7px 12px;background:#FBF8F1;color:#7C6329}button[aria-pressed=true]{background:#7C6329;color:white}.card{background:#FBF8F1;border:1px solid #D9CFB8;border-radius:12px;padding:18px;margin:12px 0;overflow-wrap:anywhere}.verse{font-family:Amiri,serif;font-size:24px;line-height:2;border-bottom:1px solid #D9CFB8;padding:12px 0;margin-bottom:12px}.note{line-height:1.9;white-space:normal}.meta{font-size:14px;color:#6B6355}.note-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}#status{color:#6B6355}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #A8863B;outline-offset:3px}
</style>
</head>
<body>
<header><nav><a href="index.html">← فهرس السور</a><button id="auth-status">تسجيل الدخول</button></nav><h1>هاشتاجات الملاحظات</h1><p>اختر هاشتاجًا لعرض الآيات وتحتها ملاحظاتك، بترتيب السور والآيات في المصحف.</p><input id="search" type="search" placeholder="ابحث عن هاشتاج…" aria-label="ابحث عن هاشتاج"><div id="tags" aria-label="الهاشتاجات"></div></header>
<main><p id="status" role="status">جارٍ تحميل الملاحظات…</p><h2 id="heading"></h2><div id="notes"></div></main>
<script src="assets/quran-data.js"></script>
<script type="module" src="assets/firebase-sync.js"></script>
<script src="assets/note-hashtags.js"></script>
</body></html>
